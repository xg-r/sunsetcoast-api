# 운영: EC2 한 대 (t4g.small, ARM). 밖으로는 Caddy(80/443)만 열고 web·api·mysql은 내부망에만 둔다.
#   admin.sunsetcoast.kr → Caddy → web(Next.js) → (내부망) api
#   api.sunsetcoast.kr   → Caddy → api 의 /public/**, /me/** 만 (관리자 API는 밖에서 닿지 않음)
# 사용: deploy 폴더에서 `docker compose pull && docker compose up -d` (비밀값은 같은 폴더의 .env)
name: sunsetcoast

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api
    mem_limit: 128m
    logging: *logging

  web:
    image: ghcr.io/xg-r/sunsetcoast-admin-web:${WEB_TAG:-latest}
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
    depends_on:
      - api
    mem_limit: 384m
    logging: *logging

  api:
    image: ghcr.io/xg-r/sunsetcoast-api:${API_TAG:-latest}
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/sunsetcoast?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: sunsetcoast
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      AUTH_SUPER_ADMINS: ${AUTH_SUPER_ADMINS}
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: 768m
    logging: *logging

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      MYSQL_DATABASE: sunsetcoast
      MYSQL_USER: sunsetcoast
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+09:00
      # 메모리 2GB 서버: 버퍼를 작게
      - --innodb-buffer-pool-size=256M
      - --performance-schema=OFF
      # 바이너리 로그 끔 (복제 안 함, 백업은 mysqldump). 로그인 기록 트리거(V37)를 일반 계정으로 만들 수 있다
      - --skip-log-bin
    # DBeaver 직접 접속용 (README 9번). 막는 것은 보안 그룹이다: 3306 인바운드는 사무실·집 IP만 연다.
    # Docker가 연 포트는 ufw를 거치지 않으니 서버 방화벽으로는 막히지 않는다
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 512m
    logging: *logging

volumes:
  mysql-data:
  caddy-data:
  caddy-config:
