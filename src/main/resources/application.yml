# 모든 환경 공통. 환경별 값은 application-{profile}.yml

server:
  # 관리자 화면(Next.js)이 /api/*, /oauth2/*, /login/oauth2/* 를 넘겨 준다.
  # X-Forwarded-Host/Proto 를 믿어야 OAuth redirect_uri 가 화면 주소로 만들어진다.
  # 백엔드를 인터넷에 직접 열지 말고 화면(또는 리버스 프록시)을 통해서만 받을 것.
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 12h
      cookie:
        http-only: true
        same-site: lax

spring:
  security:
    oauth2:
      client:
        registration:
          naver:
            client-name: 네이버
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            # 네이버는 동의 항목을 개발자센터에서 정한다 (닉네임, 이메일)
          kakao:
            client-name: 카카오
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            # 이메일(account_email)은 카카오 동의 항목 설정 후 추가
            scope: profile_nickname
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

sunsetcoast:
  auth:
    # 로그인하면 슈퍼어드민이 되는 계정. 첫 본사 계정을 정할 때만 쓴다 ("KAKAO:123,NAVER:abc")
    # 계정 키는 로그인 후 관리자 화면의 '권한 없음' 안내에 나온다
    super-admins: ${AUTH_SUPER_ADMINS:}
    login-success-url: /
    login-failure-url: /login?error
    dev-login-enabled: false
