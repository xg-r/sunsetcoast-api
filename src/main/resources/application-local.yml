spring:
  mvc:
    apiversion:
      default: 1.0
      use:
        header: X-API-Version
  datasource:
    url: jdbc:mysql://localhost:3306/sunsetcoast
    username: root
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
