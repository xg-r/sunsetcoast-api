server:
  tomcat:
    # 정산 파일을 한 번에 여러 개 올린다 (기본값 10개, 8월 한 달치만 27개)
    max-part-count: 200

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB
  mvc:
    apiversion:
      default: 1.0
      use:
        header: X-API-Version
  datasource:
    url: jdbc:mysql://localhost:3306/sunsetcoast
    username: root
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      client:
        registration:
          # 로컬에서 실제 로그인을 해 보려면 환경 변수로 키를 넣는다. 없으면 개발용 로그인만 쓸 수 있다
          naver:
            client-id: ${NAVER_CLIENT_ID:local-unset}
            client-secret: ${NAVER_CLIENT_SECRET:local-unset}
          kakao:
            client-id: ${KAKAO_CLIENT_ID:local-unset}
            client-secret: ${KAKAO_CLIENT_SECRET:local-unset}
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  default-produces-media-type: application/json

sunsetcoast:
  auth:
    # 역할별 개발용 로그인 (POST /auth/dev-login?role=SITE_MANAGER). 로컬에서만 켠다
    dev-login-enabled: true
