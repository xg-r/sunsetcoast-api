server:
  tomcat:
    # 정산 파일을 한 번에 여러 개 올린다 (기본값 10개, 8월 한 달치만 27개)
    max-part-count: 200

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB
  mvc:
    apiversion:
      default: 1.0
      use:
        header: X-API-Version
  datasource:
    url: jdbc:mysql://localhost:3306/sunsetcoast
    username: root
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  default-produces-media-type: application/json
